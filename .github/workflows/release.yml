name: Release

on:
  push:
    tags:
      - "v*"

# Each job asks for what it needs. Signing uses the job's GitHub OIDC token, so
# id-token: write goes only to the jobs that sign. Actions are pinned by commit:
# these jobs hold the identity every release is signed with.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Builds and publishes the archives, their SBOMs, checksums.txt and the
  # images, and signs checksums.txt and the images. Once the GitHub release
  # exists a re-run of this job fails, so what follows publishing lives in the
  # provenance and chart jobs, which can be re-run on their own.
  release:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push the images
      id-token: write   # keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # Build from a clean cache: the CI cache is written by jobs on main
          # that run other actions, and these binaries get signed.
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Install syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Bumped by hand: Dependabot does not track this version.
          version: v2.20.3
          args: release --clean --release-notes=RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A release candidate and the final tag can point at one commit.
          # Build the tag that started this run, not the one that sorts first.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # The release is public by now. If this upload fails, the provenance
      # and chart jobs are skipped and this job cannot be re-run: cut a patch
      # release to get the release signed and attested.
      - name: Keep the checksums and image digests for provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-subjects
          path: |
            dist/checksums.txt
            dist/digests.txt
          if-no-files-found: error

  # GitHub build provenance for the archives and both images. An image's
  # attestation is also pushed next to it, for verifiers that run in a cluster.
  provenance:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      packages: write       # push the image attestations
      id-token: write       # sign the attestations
      attestations: write   # store them on GitHub
    steps:
      - name: Fetch the checksums and image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-subjects

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt

      - name: Find the image digests
        id: digests
        run: |
          set -euo pipefail
          # digests.txt holds one "<sha256 hex>  <image>:<tag>" line per tag.
          digest() {
            local d
            d="$(awk -v ref="$1" '$2 == ref { sub(/^sha256:/, "", $1); print "sha256:" $1; exit }' digests.txt)"
            if [[ ! "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: no digest for $1 in digests.txt" >&2
              return 1
            fi
            echo "$d"
          }
          main="$(digest "ghcr.io/stephnangue/warden:${GITHUB_REF_NAME}")"
          debug="$(digest "ghcr.io/stephnangue/warden:${GITHUB_REF_NAME}-debug")"
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "debug=$debug" >> "$GITHUB_OUTPUT"

      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/stephnangue/warden
          subject-digest: ${{ steps.digests.outputs.main }}
          push-to-registry: true

      - name: Attest the debug image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/stephnangue/warden
          subject-digest: ${{ steps.digests.outputs.debug }}
          push-to-registry: true

  # Packages, publishes and signs the Helm chart. A re-run finds the chart an
  # earlier attempt pushed and signs that one rather than refusing it.
  chart:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write       # attach the chart to the GitHub release
      packages: write       # push the chart and its attestation
      id-token: write       # keyless signing and attestation
      attestations: write   # store the attestation on GitHub
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.2

      - name: Package, publish and sign the Helm chart
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHART_REF="ghcr.io/stephnangue/charts/warden"
          CHART_VERSION="$(awk '/^version:/{print $2}' deploy/helm/warden/Chart.yaml)"
          # A release candidate publishes a prerelease of the chart
          # (v0.23.0-rc.1 gives 0.3.9-rc.1), which leaves the plain version
          # free for the final release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            CHART_VERSION="${CHART_VERSION}-${GITHUB_REF_NAME#*-}"
          fi
          CHART_TGZ="warden-${CHART_VERSION}.tgz"

          # Only "not found" means the version is free; any other registry
          # error stops the job rather than pushing over a published chart.
          if OUT="$(docker buildx imagetools inspect "${CHART_REF}:${CHART_VERSION}" --format '{{ .Manifest.Digest }}' 2>&1)"; then
            EXISTS=yes
          elif [[ "$OUT" == *": not found"* ]]; then
            EXISTS=no
          else
            echo "ERROR: cannot tell whether ${CHART_REF}:${CHART_VERSION} exists: $OUT"
            exit 1
          fi

          # The Warden version (the git tag) bumps every release, but the
          # chart version is independent and only moves when the chart
          # templates or values change. On a first attempt, a chart already
          # published at this version means version: was not bumped: refuse
          # to clobber it. On a re-run, a chart pinned to this tag was pushed
          # by an earlier attempt of this run, and is signed as it is.
          if [ "$EXISTS" = yes ]; then
            if [ "$GITHUB_RUN_ATTEMPT" -le 1 ]; then
              echo "ERROR: chart version $CHART_VERSION is already published."
              echo "Bump deploy/helm/warden/Chart.yaml 'version:' before tagging."
              exit 1
            fi
            helm pull "oci://${CHART_REF}" --version "$CHART_VERSION"
            PUBLISHED="$(helm show chart "$CHART_TGZ" | awk '/^appVersion:/{gsub(/"/, "", $2); print $2}')"
            if [ "$PUBLISHED" != "$VERSION" ]; then
              echo "ERROR: chart version $CHART_VERSION is already published for Warden $PUBLISHED."
              echo "Bump deploy/helm/warden/Chart.yaml 'version:' before tagging."
              exit 1
            fi
            echo "Chart $CHART_VERSION was pushed by an earlier attempt; signing it."
          else
            # Pin appVersion to the tag so end users always pull the Docker
            # image matching the chart they installed, regardless of what
            # the Chart.yaml committed at tag time happens to say.
            helm package deploy/helm/warden --version "$CHART_VERSION" --app-version "$VERSION"
            # Helm authenticates against ghcr.io using the docker/login-action
            # session.
            helm push "$CHART_TGZ" oci://ghcr.io/stephnangue/charts
          fi

          # Read the digest from the registry: helm push prints it on stderr.
          DIGEST="$(docker buildx imagetools inspect "${CHART_REF}:${CHART_VERSION}" --format '{{ .Manifest.Digest }}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: no digest for ${CHART_REF}:${CHART_VERSION}: '$DIGEST'"
            exit 1
          fi
          # Sign only a manifest that carries exactly the .tgz signed and
          # attached below, whatever the tag pointed at in between.
          LAYER="$(docker buildx imagetools inspect --raw "${CHART_REF}@${DIGEST}" \
            | jq -r '.layers[] | select(.mediaType == "application/vnd.cncf.helm.chart.content.v1.tar+gzip") | .digest')"
          LOCAL="sha256:$(sha256sum "$CHART_TGZ" | cut -d' ' -f1)"
          if [ "$LAYER" != "$LOCAL" ]; then
            echo "ERROR: ${CHART_REF}@${DIGEST} holds chart content $LAYER, not $CHART_TGZ ($LOCAL)."
            exit 1
          fi
          cosign sign --yes "${CHART_REF}@${DIGEST}"
          cosign sign-blob --yes --bundle "${CHART_TGZ}.sigstore.json" "$CHART_TGZ"

          # Attach the same tarball and its signature to the GitHub Release
          # for users who cannot use OCI registries (air-gapped clusters,
          # restrictive network policies, etc.).
          gh release upload "$GITHUB_REF_NAME" "$CHART_TGZ" "${CHART_TGZ}.sigstore.json" --clobber
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest the Helm chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/stephnangue/charts/warden
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
